<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over">
    <mat-toolbar>Operaciones:</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item href="#">Compra de Inversión</a>
      <a mat-list-item href="#">Consulta de inversiones</a>
      <a mat-list-item href="#">Actualizar producto de inversión</a>
      <a mat-list-item href="#">Cerrar sesión</a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Botón flotante para abrir el sidenav -->
  <button mat-icon-button class="menu-button" (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
</mat-sidenav-container>
